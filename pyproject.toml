[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A reusable, policy-controlled runtime foundation for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.16"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
harness = "ai_harness.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
